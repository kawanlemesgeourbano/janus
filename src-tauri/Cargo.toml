[package]
name = "janus"
version = "1.0.8-alpha.1"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.6", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
ed25519-dalek = "2.2.0"
sha2 = "0.10"
hex = "0.4"
semver = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Authentication_Identity", "Win32_NetworkManagement_NetManagement"] }
[profile.release]
opt-level = "s"
strip = true
